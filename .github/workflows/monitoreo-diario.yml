name: Monitoreo diario de precios

on:
  schedule:
    # 13:00 UTC = 7:00 AM Ciudad de México (ajusta si cambia el horario de verano)
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions

jobs:
  monitorear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Correr monitoreo
        run: python main.py

      - name: Guardar resultados en el repo
        run: |
          git config user.name "price-monitor-bot"
          git config user.email "actions@github.com"
          git add data/ dashboard_data.js
          git diff --staged --quiet || git commit -m "Actualización de precios $(date -u +%Y-%m-%d)"
          git push
